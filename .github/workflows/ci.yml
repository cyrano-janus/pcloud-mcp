name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: true
      - name: Verify dependencies and formatting
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l cmd internal)"
      - name: Build, race tests and vet
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          make build
          python3 scripts/smoke_test.py ./bin/pcloud-mcp
          go test -race -count=1 -timeout=90s ./...
          go vet ./...
      - name: Fuzz configuration and targeted mutations
        run: |
          go test ./internal/config -run='^$' -fuzz=FuzzConfig -fuzztime=30s -parallel=2
          go test ./internal/policy -run='^$' -fuzz=FuzzName -fuzztime=30s -parallel=2
          go test ./internal/pcloud -run='^$' -fuzz=FuzzDecode -fuzztime=30s -parallel=2
          go test ./internal/netguard -run='^$' -fuzz=FuzzPublicIP -fuzztime=30s -parallel=2
          python3 scripts/mutation_test.py
      - name: Install pinned security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: Vulnerability and secret checks
        run: |
          govulncheck ./...
          (cd cmd/pcloud-mcp && govulncheck -scan=module)
          gitleaks git --redact --no-banner
      - name: Build container
        run: |
          docker build --tag pcloud-mcp:ci .
          docker run --rm --network none --read-only --cap-drop ALL pcloud-mcp:ci --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pcloud-mcp-linux-amd64
          path: bin/
          retention-days: 14
