# Readiness service with explicitly disabled hosted provider onboarding.
# Set PCLOUD_MCP_ENABLED=true only after complete OAuth configuration and verification.
services:
  - type: web
    name: pcloud-mcp
    runtime: go
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: go build -trimpath -o bin/pcloud-remote ./cmd/pcloud-remote
    startCommand: ./bin/pcloud-remote
    healthCheckPath: /healthz

    envVars:
      - key: PCLOUD_SETUP_ENABLED
        value: 'false'
      - key: PCLOUD_MCP_ENABLED
        value: 'false'
