# Readiness service with explicitly disabled hosted provider onboarding.
# /mcp stays 503 until the protected transport is configured and verified.
services:
  - type: web
    name: pcloud-mcp
    runtime: go
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: go build -trimpath -o bin/pcloud-remote ./cmd/pcloud-remote
    startCommand: ./bin/pcloud-remote
    healthCheckPath: /healthz

    envVars:
      - key: PCLOUD_SETUP_ENABLED
        value: 'false'
