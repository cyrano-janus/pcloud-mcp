# Fill the prompted credentials in Render, never in this file.
services:
  - type: web
    name: pcloud-mcp
    runtime: docker
    repo: https://github.com/cyrano-janus/pcloud-mcp
    branch: main
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: PCLOUD_MCP_TRANSPORT
        value: http
      - key: PCLOUD_MCP_TLS_PROXY
        value: render
      - key: PCLOUD_MCP_MAX_FRAME_BYTES
        value: '8388608'
      - key: PCLOUD_ENABLE_WRITES
        value: 'false'
      - key: PCLOUD_REGION
        sync: false
      - key: PCLOUD_USER_ID
        sync: false
      - key: PCLOUD_ROOT_FOLDER_ID
        sync: false
      - key: PCLOUD_ACCESS_TOKEN
        sync: false
      - key: PCLOUD_MCP_OAUTH_ISSUER
        sync: false
      - key: PCLOUD_MCP_INTROSPECTION_URL
        sync: false
      - key: PCLOUD_MCP_OAUTH_CLIENT_ID
        sync: false
      - key: PCLOUD_MCP_OAUTH_CLIENT_SECRET
        sync: false
      - key: PCLOUD_MCP_OAUTH_SUBJECT
        sync: false
